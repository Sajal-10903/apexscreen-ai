version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_interview_system
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/interview.db}
      - CHROMA_PERSIST_DIRECTORY=${CHROMA_PERSIST_DIRECTORY:-./chroma_db}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - INTERVIEW_QUESTION_COUNT=${INTERVIEW_QUESTION_COUNT:-8}
      - MAX_RESUME_SIZE_MB=${MAX_RESUME_SIZE_MB:-5}
      - RATE_LIMIT_UPLOAD_PER_MINUTE=${RATE_LIMIT_UPLOAD_PER_MINUTE:-10}
      - RATE_LIMIT_ANSWER_PER_MINUTE=${RATE_LIMIT_ANSWER_PER_MINUTE:-30}
      # Set to your deployed frontend origin(s) in production, comma-separated
      # if serving multiple (e.g. apex + www). Not required when the frontend
      # is served from this same container (same-origin, no CORS needed).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
